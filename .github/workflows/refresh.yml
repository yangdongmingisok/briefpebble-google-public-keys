name: Refresh Google public certificates
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: google-public-certificates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Fetch from the fixed Google HTTPS endpoint
        run: python3 publish.py
      - name: Publish public certificates and freshness metadata
        run: |
          git config user.name 'briefpebble-certificate-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-certs.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Google public signing certificates'
          git push origin HEAD:main
      - name: Prepare public certificate files
        run: |
          mkdir -p public
          cp google-certs.json public/google-certs.json
          printf '%s\n' 'BriefPebble public Google signing certificate relay. No user data is processed.' > public/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
