name: Refresh Google public certificates
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: google-public-certificates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Fetch from the fixed Google HTTPS endpoint
        run: python3 publish.py
      - name: Publish public certificates and freshness metadata
        run: |
          git config user.name 'briefpebble-certificate-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-certs.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Google public signing certificates'
          git push origin HEAD:main
