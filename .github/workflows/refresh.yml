name: Refresh Google public certificates
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Certificate commits continue every five minutes, without starting a Pages build.
    # Pages is a backup; the primary reader uses the repository API and local cache.
    paths: ['.github/workflows/refresh.yml', 'publish.py', 'validate_snapshot.py']
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: google-public-certificates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Fetch from the fixed Google HTTPS endpoint
        if: github.event_name != 'push'
        run: |
          for attempt in 1 2 3; do
            if python3 publish.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      # VPS is the repository writer. Fallback runs deploy their fresh snapshot
      # directly, avoiding non-fast-forward races with the five-minute publisher.
      - name: Validate public snapshot before publishing
        run: python3 validate_snapshot.py google-certs.json
      - name: Prepare public certificate files
        run: |
          mkdir -p public
          cp google-certs.json public/google-certs.json
          printf '%s\n' 'gistly public Google signing certificate relay. No user data is processed.' > public/index.html
      # A failed upload may leave a reserved artifact name behind. Each retry
      # uses its own name; deployment selects only an upload that succeeded.
      - name: Upload public certificates
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        continue-on-error: true
        with:
          name: github-pages-attempt-1
          path: public
      - name: Wait before retrying upload
        if: steps.upload.outcome == 'failure'
        run: sleep 10
      - name: Retry public certificate upload
        if: steps.upload.outcome == 'failure'
        id: upload_retry
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        continue-on-error: true
        with:
          name: github-pages-attempt-2
          path: public
      - name: Wait before the final upload attempt
        if: steps.upload_retry.outcome == 'failure'
        run: sleep 20
      - name: Final public certificate upload attempt
        if: steps.upload_retry.outcome == 'failure'
        id: upload_final
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          name: github-pages-attempt-3
          path: public
      # Uploaded artifacts can briefly be absent from GitHub's metadata service.
      # Retry deployment with the same artifact; never report success if all attempts fail.
      - name: Deploy public certificates
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        with:
          artifact_name: ${{ steps.upload.outcome == 'success' && 'github-pages-attempt-1' || steps.upload_retry.outcome == 'success' && 'github-pages-attempt-2' || 'github-pages-attempt-3' }}
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry public certificate deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment_retry
        with:
          artifact_name: ${{ steps.upload.outcome == 'success' && 'github-pages-attempt-1' || steps.upload_retry.outcome == 'success' && 'github-pages-attempt-2' || 'github-pages-attempt-3' }}
        continue-on-error: true
      - name: Wait before the final deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 20
      - name: Final public certificate deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment_final
        with:
          artifact_name: ${{ steps.upload.outcome == 'success' && 'github-pages-attempt-1' || steps.upload_retry.outcome == 'success' && 'github-pages-attempt-2' || 'github-pages-attempt-3' }}
