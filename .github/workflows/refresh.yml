name: Refresh Google public certificates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [google-certs.json]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: google-public-certificates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch from the fixed Google HTTPS endpoint
        if: github.event_name != 'push'
        run: python3 publish.py
      # VPS is the repository writer. Fallback runs deploy their fresh snapshot
      # directly, avoiding non-fast-forward races with the five-minute publisher.
      - name: Prepare public certificate files
        run: |
          mkdir -p public
          cp google-certs.json public/google-certs.json
          printf '%s\n' 'gistly public Google signing certificate relay. No user data is processed.' > public/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: public
      # Uploaded artifacts can briefly be absent from GitHub's metadata service.
      # Retry deployment with the same artifact; never report success if all attempts fail.
      - name: Deploy public certificates
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry public certificate deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment_retry
        continue-on-error: true
      - name: Wait before the final deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 20
      - name: Final public certificate deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment_final
